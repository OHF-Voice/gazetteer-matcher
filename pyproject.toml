[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gazetteer-matcher"
version = "1.2.0"
description = "Constraint-driven gazetteer matcher for Home Assistant intents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "PyYAML>=6.0",
  "unicode-rbnf>=2.4.0",
  "home-assistant-intents>=2026.8.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "black",
  "pylint",
  "flake8",
  "isort",
  "mypy",
  "types-PyYAML",
]

[project.scripts]
gazetteer-match = "gazetteer_matcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gazetteer_matcher = ["data/*.yaml"]

[tool.black]
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
