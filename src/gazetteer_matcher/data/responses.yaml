language: en

# User-facing rejection messages. Internal matcher reasons are intentionally
# not exposed: they are diagnostic and may change as constraints evolve.
templates:
  generic: "Sorry, I couldn't understand that command."
  no_action_named_target: "Sorry, I see you're targeting {target} ({target_type}), but I don't know what action to take."
  no_action_target: "Sorry, I see you're targeting {target}, but I don't know what action to take."
  no_action: "Sorry, I don't know what action to take."
  missing_target: "Sorry, I think you're trying to {action}, but I'm not sure."
  unsupported_target_action_named: "Sorry, I can't {action} {target} ({target_type}); that action doesn't apply."
  unsupported_target_action: "Sorry, I can't {action} {target}; that action doesn't apply."
  unsupported_action: "Sorry, I can't {action} that target."
  unexplained_target: "Sorry, I see you're referring to {target}, but I didn't understand the whole request."
  unexplained: "Sorry, I understood part of that, but not the whole request."
  ambiguous: "Sorry, that could mean more than one thing. Please be more specific."
  conflicting_scope: "Sorry, that request names conflicting locations."
  anaphora_missing_target: "Sorry, I'm not sure what {pronoun} refers to."
  anaphora_multiple_targets: "Sorry, {pronoun} could refer to more than one previous target."
  anaphora_singular_group: "Sorry, {pronoun} refers to a group, not one device."
  anaphora_explicit_target: "Sorry, I can't combine {pronoun} with another target."
  anaphora_multiple_pronouns: "Sorry, I found more than one follow-up reference."

target_templates:
  named: "'{name}'"
  area_kind: "the {kind} in {area}"
  floor_kind: "the {kind} on {floor}"
  kind: "the {kind}"
  area: "the {area} area"
  floor: "the {floor} floor"

