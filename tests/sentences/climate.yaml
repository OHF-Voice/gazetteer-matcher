language: en

# Temperature queries adapted from the English intent-sentences tests. Bare
# queries use the voice satellite's area, matching Assist behavior.
cases:
  - sentence: what is the temperature
    context_area: Living Room
    frames:
      - intent: HassClimateGetTemperature
        combination: default
        response_key: default
        slots: {area: living_room}

  - sentence: how warm is it
    context_area: Living Room
    frames:
      - intent: HassClimateGetTemperature
        combination: default
        response_key: default
        slots: {area: living_room}

  - sentences:
      - what is the temperature in the living room
      - what's the temp in the living room
      # Natural terse forms not covered by the built-in HassIL grammar.
      - living room temperature
      - living room temp
    frames:
      - intent: HassClimateGetTemperature
        combination: area_only
        response_key: default
        slots: {area: living_room}

  - sentences:
      - what is the temperature of ecobee
      - hows the temperature of ecobee
      - ecobee temperature
      - ecobee temp
    frames:
      - intent: HassClimateGetTemperature
        combination: name_only
        response_key: default
        slots: {name: climate.ecobee}

  - sentences:
      - set thermostat to -5 degrees
      - set thermostat to minus five degrees
    frames:
      - intent: HassClimateSetTemperature
        combination: name_temperature
        response_key: default
        slots: {name: climate.ecobee, temperature: -5}
