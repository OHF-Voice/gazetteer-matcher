language: en

# Representative state cardinalities and scopes from the English
# intent-sentences tests. The response key preserves the question form for
# downstream rendering when intent, combination, and slots are otherwise equal.
cases:
  - sentences:
      - did I leave the front door unlocked
      - have I left the front door unsecured
    frames:
      - intent: HassGetState
        combination: name_state
        response_key: one_yesno
        slots: {name: lock.front_door, state: unlocked}

  - sentences:
      - have I left any kitchen lights on
      - do I have any kitchen lights lit
    frames:
      - intent: HassGetState
        combination: domain_state_area
        response_key: any
        slots: {area: kitchen, domain: light, state: "on"}

  - sentence: which lights are lit
    frames:
      - intent: HassGetState
        combination: domain_state
        response_key: which
        slots: {domain: light, state: "on"}

  - sentence: is the kitchen window ajar
    frames:
      - intent: HassGetState
        combination: name_state
        response_key: one_yesno
        slots: {name: cover.kitchen_window, state: open}

  - sentence: is the front door secured
    frames:
      - intent: HassGetState
        combination: name_state
        response_key: one_yesno
        slots: {name: lock.front_door, state: locked}

  - sentences:
      - are any lights on
      - are any lights currently on
      - check if any lights are on
      - tell me if any lights are on
    frames:
      - intent: HassGetState
        combination: domain_state
        response_key: any
        slots: {domain: light, state: "on"}

  - sentence: please are any lights on
    frames:
      - intent: HassGetState
        combination: domain_state
        response_key: any
        slots: {domain: light, state: "on"}

  - sentence: are all the lights off
    frames:
      - intent: HassGetState
        combination: domain_state
        response_key: all
        slots: {domain: light, state: "off"}

  - sentences:
      - which lights are on
      - tell me which lights are on
      - check which lights are on
    frames:
      - intent: HassGetState
        combination: domain_state
        response_key: which
        slots: {domain: light, state: "on"}

  - sentences:
      - how many lights are on
      - tell me how many lights are on
    frames:
      - intent: HassGetState
        combination: domain_state
        response_key: how_many
        slots: {domain: light, state: "on"}

  - sentences:
      - are any kitchen lights on
      - are the kitchen lights on
      - check whether any kitchen lights are on
    frames:
      - intent: HassGetState
        combination: domain_state_area
        response_key: any
        slots: {area: kitchen, domain: light, state: "on"}

  - sentences:
      - which lights are on in the kitchen
      - which kitchen lights are currently on
    frames:
      - intent: HassGetState
        combination: domain_state_area
        response_key: which
        slots: {area: kitchen, domain: light, state: "on"}

  - sentence: which windows are open
    frames:
      - intent: HassGetState
        combination: device_class_state
        response_key: which
        slots: {domain: cover, device_class: window, state: open}

  - sentence: are any upstairs windows open
    frames:
      - intent: HassGetState
        combination: device_class_state_floor
        response_key: any
        slots:
          {floor: upstairs, domain: cover, device_class: window, state: open}

  - sentence: which windows are open on the second floor
    frames:
      - intent: HassGetState
        combination: device_class_state_floor
        response_key: which
        slots:
          {floor: upstairs, domain: cover, device_class: window, state: open}

  - sentence: are any lights on upstairs
    frames:
      - intent: HassGetState
        combination: domain_state_floor
        response_key: any
        slots: {floor: upstairs, domain: light, state: "on"}

  - sentence: which upstairs lights are on
    frames:
      - intent: HassGetState
        combination: domain_state_floor
        response_key: which
        slots: {floor: upstairs, domain: light, state: "on"}

  - sentence: please tell me the outside temperature
    frames:
      - intent: HassGetState
        combination: name_only
        response_key: one
        slots: {name: sensor.outside_temperature}

  - sentence: how is the outside temperature
    frames:
      - intent: HassGetState
        combination: name_only
        response_key: one
        slots: {name: sensor.outside_temperature}

  - sentence: where is jane
    frames:
      - intent: HassGetState
        combination: name_where
        response_key: where
        slots: {name: person.jane}

  - sentence: is jane home
    frames:
      - intent: HassGetState
        combination: name_zone
        response_key: one_yesno
        slots: {name: person.jane, state: home}
