language: en

cases:
  - sentences:
      - what's the weather
      - what is the weather like
      - weather
      - weather report
      - forecast
    frames:
      - intent: HassGetWeather
        combination: default
        slots: {}

  - sentences:
      - what's the weather like in london
      - what is the weather in London like
      - London forecast
      - London weather
    frames:
      - intent: HassGetWeather
        combination: name_only
        slots: {name: weather.london}
